[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "loglens-api"
version = "0.1.0"
description = "LogLens API backend service"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.14.0,<2.0.0",
  "asyncpg>=0.30.0,<1.0.0",
  "argon2-cffi>=23.1.0,<24.0.0",
  "celery>=5.4.0,<6.0.0",
  "email-validator>=2.2.0,<3.0.0",
  "fastapi>=0.139.0,<1.0.0",
  "httpx>=0.28.0,<1.0.0",
  "msgpack>=1.2.1,<2.0.0",
  "opentelemetry-api>=1.37.0,<2.0.0",
  "opentelemetry-exporter-otlp-proto-http>=1.37.0,<2.0.0",
  "opentelemetry-instrumentation-celery>=0.58b0,<1.0.0",
  "opentelemetry-instrumentation-fastapi>=0.58b0,<1.0.0",
  "opentelemetry-instrumentation-httpx>=0.58b0,<1.0.0",
  "opentelemetry-instrumentation-redis>=0.58b0,<1.0.0",
  "opentelemetry-instrumentation-sqlalchemy>=0.58b0,<1.0.0",
  "opentelemetry-sdk>=1.37.0,<2.0.0",
  "orjson>=3.10.0,<4.0.0",
  "prometheus-client>=0.22.0,<1.0.0",
  "prometheus-fastapi-instrumentator>=8.0.0,<9.0.0",
  "python-jose[cryptography]>=3.4.0,<4.0.0",
  "psycopg[binary]>=3.2.0,<4.0.0",
  "pydantic>=2.11.0,<3.0.0",
  "pydantic-settings>=2.10.0,<3.0.0",
  "redis>=6.4.0,<7.0.0",
  "sentry-sdk[fastapi]>=2.35.0,<3.0.0",
  "sqlalchemy>=2.0.42,<3.0.0",
  "starlette>=1.3.1,<2.0.0",
  "structlog>=25.4.0,<26.0.0",
  "uvicorn[standard]>=0.35.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20.0,<1.0.0",
  "bandit>=1.7.9,<2.0.0",
  "mypy>=1.17.0,<2.0.0",
  "pip-audit>=2.7.3,<3.0.0",
  "pre-commit>=4.2.0,<5.0.0",
  "pytest>=9.0.3,<10.0.0",
  "pytest-asyncio>=1.1.0,<2.0.0",
  "pytest-cov>=6.2.0,<7.0.0",
  "ruff>=0.12.0,<1.0.0",
  "types-redis>=4.6.0.20241004",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
tmp_path_retention_policy = "failed"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "C4", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
show_error_codes = true
pretty = true
plugins = []

[[tool.mypy.overrides]]
module = ["argon2.*", "jose.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["celery.*"]
ignore_missing_imports = true
ignore_errors = true

[[tool.mypy.overrides]]
module = ["sentry_sdk.*"]
ignore_missing_imports = true
ignore_errors = true

[[tool.mypy.overrides]]
module = ["opentelemetry.*"]
ignore_missing_imports = true
ignore_errors = true

[[tool.mypy.overrides]]
module = ["app.observability.celery"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["app.observability.sentry"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["app.observability.tracing"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["tests.unit.test_observability"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["migrations.*"]
ignore_errors = true

[tool.coverage.run]
branch = true
source = ["app"]
omit = [
  "tests/*",
  "migrations/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 70

[tool.coverage.xml]
output = "coverage.xml"

[tool.bandit]
exclude_dirs = ["tests", "migrations", ".venv"]
skips = ["B101"]
