name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: loglens
          POSTGRES_USER: loglens
          POSTGRES_PASSWORD: loglens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loglens -d loglens"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      JWT_SECRET_KEY: this-is-a-long-test-secret-key-at-least-32-characters
      DATABASE_URL: postgresql+asyncpg://loglens:loglens@localhost:5432/loglens
      ALEMBIC_DATABASE_URL: postgresql+psycopg://loglens:loglens@localhost:5432/loglens
      TEST_DATABASE_URL: postgresql+asyncpg://loglens:loglens@localhost:5432/loglens
      REDIS_URL: redis://localhost:6379/0
      CELERY_TASK_ALWAYS_EAGER: true
      AI_PROVIDER: mock

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy .

      - name: Alembic migration validation
        run: |
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head

      - name: Pytest with coverage
        run: pytest -v --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage xml
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: loglens-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
